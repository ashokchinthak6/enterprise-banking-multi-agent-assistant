[project]
name = "enterprise-banking-multi-agent-assistant"
version = "1.0.0"
description = "A governed multi-agent banking assistant with MCP tools, Azure integration, HITL payment approvals, FastAPI, and React."
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Ashok Chinthakindi" }]
dependencies = [
    "fastapi>=0.116.1",
    "fastmcp>=2.0.0",
    "pydantic>=2.11.0",
    "pydantic-settings>=2.10.0",
    "python-multipart>=0.0.20",
    "uvicorn[standard]>=0.35.0",
]

[project.optional-dependencies]
azure = [
    "agent-framework-core>=1.0.0",
    "agent-framework-openai>=1.0.0",
    "azure-ai-documentintelligence>=1.0.1",
    "azure-identity>=1.24.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=8.4.0",
    "pytest-asyncio>=0.26.0",
    "ruff>=0.12.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q"

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
