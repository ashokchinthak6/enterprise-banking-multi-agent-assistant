services:
  api:
    build: ./backend
    env_file:
      - .env
    ports:
      - "8000:8000"

  mcp:
    build: ./backend
    command: ["uv", "run", "python", "-m", "app.mcp_server"]
    env_file:
      - .env
    ports:
      - "8001:8001"

  web:
    build: ./frontend
    environment:
      VITE_API_BASE_URL: http://localhost:8000
    ports:
      - "5173:80"
    depends_on:
      - api

